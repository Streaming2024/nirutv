<body>

           NPL2:"https://yonotv-now.pages.dev/splyrr?src=https://g-cdn.styxsports.live/LiveApp/streams/Iojkid1n2BsRlDqa986985348812.m3u8",

        // Initialize player without any embed protection
        function initializePlayer() {
          
            const urlParams = new URLSearchParams(window.location.search);
            const channel = urlParams.get('id');
            const iframe = document.getElementById('player');
            
            if (channel && channels[channel]) {
                iframe.src = channels[channel];
            } else {
                // Default channel if none specified
                iframe.src = channels.startsoon;
            }
            
            
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializePlayer);
    </script>

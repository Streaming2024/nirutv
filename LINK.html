<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAM</title>

    <style>
        body {
            height: 100vh;
            margin: 0;
            padding: 0;
            color: #fff;
            text-align: center;
            overflow: hidden;
            font-family: Tahoma, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #000;
        }

        #player {
            width: 100%;
            height: 100%;
            border: none;
        }

       
    </style>
</head>
<body>
  
    
    <iframe id="player" loading="lazy" allowfullscreen></iframe>
    
    <script>
        const channels = { 
            //START SOON
            startsoon: "https://dns-tv.pages.dev", 
            //START SOON
             NEP2: "https://yonotv-now.pages.dev/plyrr?src=https://live5.msrktz.app/live/71426314.m3u8", 
            NEP:"https://yonotv-now.pages.dev/ytplyrr?id=HN6KK8ndgkQ",
            
             NAME:"https://yonotv-now.pages.dev/kickplayer?id=maharaamresh",
             NAME:"https://kickplayer.pages.dev/kick?id=maharaamresh",
                    //NEP
            
           
            YUB:"https://yonotv-now.pages.dev/kickplayer",
            YUB2:"https://yonotv.pages.dev/fox",
            YUB3:"https://yonotv.pages.dev/hindi2",
            YUB4:"https://yonotv.pages.dev/wtv",
            YUB5:"https://yonotv-now.pages.dev/plyrr?src=https://tvsen5.aynaott.com/willowhd/index.m3u8",
            YUB6:"https://yonotv.pages.dev/wtv2",

           
            
        };

       

        // Initialize player without any embed protection
        function initializePlayer() {
          
            const urlParams = new URLSearchParams(window.location.search);
            const channel = urlParams.get('id');
            const iframe = document.getElementById('player');
            
            if (channel && channels[channel]) {
                iframe.src = channels[channel];
            } else {
                // Default channel if none specified
                iframe.src = channels.startsoon;
            }
            
            
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializePlayer);
    </script>
</body>
</html>

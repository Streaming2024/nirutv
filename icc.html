<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Cricket Matches</title>
<style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --accent:#38bdf8; }
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 24px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: var(--bg); color: var(--text);
    }
    h1 { text-align: center; color: var(--accent); margin-bottom: 24px; }
    .grid {
        max-width: 1200px; margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
    }
    .card {
        background: var(--card); border-radius: 12px; overflow: hidden;
        text-decoration: none; color: inherit;
        border: 1px solid #334155;
        transition: transform .2s, border-color .2s, box-shadow .2s;
        display: block;
    }
    .card:hover {
        transform: translateY(-4px);
        border-color: var(--accent);
        box-shadow: 0 10px 20px -8px rgba(56,189,248,.35);
    }
    .card img {
        width: 100%; height: 150px; object-fit: cover;
        background: #0b1220; display: block;
    }
    .info { padding: 14px; }
    .title {
        font-weight: 600; font-size: 1rem; margin: 0 0 6px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .group { font-size: .8rem; color: #94a3b8; }
    .badge {
        display: inline-block; font-size: .7rem; padding: 2px 8px;
        border-radius: 999px; background: #ef4444; color: white;
        margin-left: 6px; vertical-align: middle;
        animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .status {
        text-align: center; color: #94a3b8; padding: 40px 0;
        font-size: 1rem;
    }
    .status.error { color: #f87171; }
</style>
</head>
<body>

<h1>🏏 Live Cricket Matches</h1>

<div id="status" class="status">Loading matches…</div>
<div class="grid" id="grid"></div>

<script>
(function () {
    'use strict';

    const M3U_URL = 'https://raw.githubusercontent.com/doctor-8trange/nexphi0/refs/heads/main/data/icc.m3u';
    const PLACEHOLDER_IMG = 'https://via.placeholder.com/300x150/1e293b/38bdf8?text=Live';

    const statusEl = document.getElementById('status');
    const gridEl   = document.getElementById('grid');

    /**
     * Parse M3U text into a map keyed by tvg-id (matches the PHP logic).
     * Returns an object: { [tvgId]: { tvg_id, logo, group, title, url, license_key } }
     */
    function parseM3U(text) {
        const lines = text.split(/\r?\n/);
        const matches = {};
        let current = null;

        for (let raw of lines) {
            const line = raw.trim();

            if (line.startsWith('#EXTINF:')) {
                const idMatch   = line.match(/tvg-id="([^"]+)"/);
                const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                const grpMatch  = line.match(/group-title="([^"]+)"/);

                // Title is everything after the last comma
                const commaIdx = line.lastIndexOf(',');
                const title = commaIdx >= 0 ? line.slice(commaIdx + 1).trim() : '';

                const tvgId = idMatch ? idMatch[1] : '';

                if (!tvgId) {
                    current = null;
                    continue;
                }

                current = {
                    tvg_id:      tvgId,
                    logo:        logoMatch ? logoMatch[1] : '',
                    group:       grpMatch  ? grpMatch[1]  : 'General',
                    title:       title,
                    url:         '',
                    license_key: '',
                };
                continue;
            }

            if (current !== null && line.startsWith('#KODIPROP:inputstream.adaptive.license_key=')) {
                current.license_key = line.slice(
                    '#KODIPROP:inputstream.adaptive.license_key='.length
                );
                continue;
            }

            // Non-comment, non-empty line = the stream URL
            if (line && !line.startsWith('#') && current !== null) {
                current.url = line;
                matches[current.tvg_id] = current;
                current = null;
            }
        }

        return matches;
    }

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function render(matches) {
        const ids = Object.keys(matches);
        if (ids.length === 0) {
            statusEl.textContent = 'No matches found.';
            statusEl.classList.remove('error');
            return;
        }

        statusEl.style.display = 'none';

        const frag = document.createDocumentFragment();

        for (const id of ids) {
            const m = matches[id];

            const card = document.createElement('a');
            card.className = 'card';
            card.href = 'iccplayer.html?id=' + encodeURIComponent(m.tvg_id);

            // Image
            if (m.logo) {
                const img = document.createElement('img');
                img.src = m.logo;
                img.alt = m.title;
                img.loading = 'lazy';
                img.onerror = function () {
                    this.onerror = null;
                    this.src = PLACEHOLDER_IMG;
                };
                card.appendChild(img);
            } else {
                const ph = document.createElement('div');
                ph.style.cssText =
                    'height:150px;display:flex;align-items:center;justify-content:center;background:#0b1220;';
                ph.textContent = 'No Image';
                card.appendChild(ph);
            }

            // Info
            const info = document.createElement('div');
            info.className = 'info';

            const titleDiv = document.createElement('div');
            titleDiv.className = 'title';
            titleDiv.innerHTML =
                escapeHtml(m.title) +
                ' <span class="badge">LIVE</span>';

            const groupDiv = document.createElement('div');
            groupDiv.className = 'group';
            groupDiv.textContent = m.group;

            info.appendChild(titleDiv);
            info.appendChild(groupDiv);
            card.appendChild(info);

            frag.appendChild(card);
        }

        gridEl.appendChild(frag);
    }

    async function init() {
        try {
            const res = await fetch(M3U_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const text = await res.text();
            const matches = parseM3U(text);
            render(matches);
        } catch (err) {
            statusEl.textContent = 'Error: Could not fetch the M3U playlist. (' + err.message + ')';
            statusEl.classList.add('error');
        }
    }

    init();
})();
</script>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kick</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script disable-devtool-auto src="https://cdn.jsdelivr.net/npm/disable-devtool@latest"></script>
  <script src="/app.js"></script>
  <script src="/block.js"></script>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #dplayer {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    iframe { z-index: 999999 !important; }
    #dplayer video { pointer-events: none; }

    #qualityMenu {
      position: absolute;
      right: 60px;
      bottom: 80px;
      background: rgba(0,0,0,0.9);
      padding: 10px 12px;
      border-radius: 6px;
      display: none;
      z-index: 99999;
    }

    .quality-item {
      padding: 8px 12px;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .quality-item:hover { background: rgba(255,255,255,0.2); }
    .quality-item.active { color: #00d4ff; font-weight: bold; }

    #refreshOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
    }

    #refreshOverlay.visible { display: flex; }

    #refreshBtn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 14px;
      padding: 15px 15px;
      transition: background 0.2s;
    }

    #refreshBtn:hover { background: rgba(255,255,255,0.2); }

    #refreshBtn .material-icons {
      font-size: 44px;
      color: #fff;
    }

    #refreshBtn span.label {
      font-size: 14px;
      color: rgba(255,255,255,0.85);
      font-family: sans-serif;
      letter-spacing: 0.02em;
    }
  </style>
</head>

<body>

  <div id="dplayer"></div>
  <div id="qualityMenu"></div>

  <div id="refreshOverlay">
    <div id="refreshBtn">

    </div>
  </div>

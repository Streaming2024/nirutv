<html lang="en">
  <head> <!--Updates-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script disable-devtool-auto src='https://cdn.jsdelivr.net/npm/disable-devtool'></script>
    <title> Stream with ID </title>
    <style>
      body {
        height: 100vh;
        margin: 0;
        padding: 0;
        color: #fff;
        text-align: center;
        overflow: hidden;
        font-family: Tahoma, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #player {
        width: 100%;
        height: 100%;
        border: none;
      }

      #text {
        position: fixed;
        bottom: 50px;
        width: 100%;
        font-size: 20px;
        color: #fff;
        text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
        z-index: 9999;
      }
    </style>

  </head>
  <body>
    <iframe id="player" loading="lazy" allowfullscreen></iframe>
    <script>
      const channels = {
    kick: "https://player.kick.com/cricketnp", 
 
        
    women:"https://dns-tv.pages.dev", 
        
  nepal:"https://freeplyrr.pages.dev/plyrr1?src=https://freeplyrr.pages.dev/nepal.m3u8", 
  nepal2:"https://freeplyrr.pages.dev/plyrr1?src=https://freeplyrr.pages.dev/nepal2.m3u8", 
  nepal3:"https://freeplyrr.pages.dev/plyrr1?src=https://freeplyrr.pages.dev/nep.m3u8", 
  nepal4:"https://freeplyrr.pages.dev/plyrr1?src=https://freeplyrr.pages.dev/nep2.m3u8", 
        

    icc2: "https://embedsports.top/embed/alpha/nepal-vs-united-states-of-america/1", 
    icc3: "https://embedsports.top/embed/alpha/nepal-vs-united-states-of-america/2", 
    icc4: "https://embedsports.top/embed/charlie/nepal-vs-usa-1629466334/1", 


  
      };
      const urlParams = new URLSearchParams(window.location.search);
      const channel = urlParams.get('id');

      function setChannel(channel) {
        const iframe = document.getElementById('player');
        iframe.src = channels[channel] || channels.tnt1;
      }
      setChannel(channel);
    </script>
  </body>
</html>

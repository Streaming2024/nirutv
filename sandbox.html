<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #000;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .video-container {
            width: 100%;
            max-width: 1200px;
            position: relative;
        }
        
        /* 16:9 Aspect Ratio */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio (9/16 = 0.5625) */
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        #videoPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            z-index: 100;
            border-radius: 10px;
        }
        
        .error-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            color: #ff4757;
        }
        
        .error-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #ff4757;
        }
        
        .error-message {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            max-width: 600px;
            line-height: 1.6;
        }
        
        .controls {
            display: flex;
            gap: 1rem;
        }
        
        button {
            background: linear-gradient(to right, #3498db, #2ecc71);
            border: none;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
        
        .hidden {
            display: none !important;
        }
        
        .ad-banner {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            z-index: 10;
            font-size: 1rem;
            animation: pulse 2s infinite;
        }
        
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            border-radius: 10px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .video-container {
                padding: 10px;
            }
            
            .error-title {
                font-size: 1.5rem;
            }
            
            .error-message {
                font-size: 1rem;
            }
            
            button {
                padding: 0.7rem 1.2rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="video-wrapper">
            <div id="loading" class="loading">
                <div class="spinner"></div>
            </div>
            
            <video id="videoPlayer" class="hidden" controls>
                <source src="https://webott.viatv.com.np/v0t1/ASportsHd/playlist.m3u8" type="application/x-mpegURL">
                Your browser does not support the video tag.
            </video>
            
            <div id="playerOverlay" class="player-overlay hidden">
                <div class="error-icon">🚫</div>
                <h2 class="error-title">Sandbox Detected</h2>
                <p class="error-message">This video cannot be played in a sandboxed iframe. Please remove the sandbox attribute from the iframe to view the content.</p>
                <div class="controls">
                    <button id="retryButton">Retry Playback</button>
                </div>
            </div>
            
            <div id="adBanner" class="ad-banner hidden">
                Advertisement: Support our content
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const videoPlayer = document.getElementById('videoPlayer');
            const playerOverlay = document.getElementById('playerOverlay');
            const retryButton = document.getElementById('retryButton');
            const adBanner = document.getElementById('adBanner');
            const loading = document.getElementById('loading');
            
            // Function to detect sandboxed iframe
            function isSandboxed() {
                try {
                    // Try to access top location - will fail in sandboxed iframe without 'allow-top-navigation'
                    if (window.self !== window.top) {
                        // We're in an iframe
                        try {
                            // This will throw an error in sandboxed iframes without 'allow-same-origin'
                            const test = window.top.location.href;
                        } catch (e) {
                            // If we can't access top location, we're likely sandboxed
                            return true;
                        }
                    }
                    
                    // Additional check for sandbox attributes
                    const iframe = window.frameElement;
                    if (iframe && iframe.hasAttribute('sandbox')) {
                        return true;
                    }
                    
                    return false;
                } catch (e) {
                    // If any error occurs, assume we're sandboxed
                    return true;
                }
            }
            
            // Initialize player
            function initPlayer() {
                // Hide loading screen
                loading.classList.add('hidden');
                
                // Check if we're in a sandboxed iframe
                if (isSandboxed()) {
                    // Show error message and hide video
                    videoPlayer.classList.add('hidden');
                    playerOverlay.classList.remove('hidden');
                    
                    // Prevent video from playing
                    videoPlayer.pause();
                    videoPlayer.currentTime = 0;
                } else {
                    // Normal playback with ads
                    videoPlayer.classList.remove('hidden');
                    playerOverlay.classList.add('hidden');
                    
                    // Try to play the video
                    videoPlayer.play().catch(e => {
                        console.log("Autoplay prevented:", e);
                    });
                    
                    // Show ad banner after 5 seconds
                    setTimeout(() => {
                        adBanner.classList.remove('hidden');
                        
                        // Hide ad banner after 10 seconds
                        setTimeout(() => {
                            adBanner.classList.add('hidden');
                        }, 10000);
                    }, 5000);
                }
            }
            
            // Wait a moment for the page to load completely
            setTimeout(initPlayer, 1000);
            
            // Retry button functionality
            retryButton.addEventListener('click', function() {
                if (!isSandboxed()) {
                    // If no longer sandboxed, play video
                    videoPlayer.classList.remove('hidden');
                    playerOverlay.classList.add('hidden');
                    
                    // Try to play the video
                    videoPlayer.play().catch(e => {
                        console.log("Autoplay prevented:", e);
                    });
                    
                    // Show ad banner after 5 seconds
                    setTimeout(() => {
                        adBanner.classList.remove('hidden');
                        
                        // Hide ad banner after 10 seconds
                        setTimeout(() => {
                            adBanner.classList.add('hidden');
                        }, 10000);
                    }, 5000);
                } else {
                    // Still sandboxed, show alert
                    alert('Sandbox restriction still active. Please remove the sandbox attribute from the iframe.');
                }
            });
            
            // Additional protection: Check periodically
            setInterval(function() {
                if (isSandboxed() && !playerOverlay.classList.contains('hidden')) {
                    // Still sandboxed, ensure video is paused
                    videoPlayer.pause();
                    videoPlayer.currentTime = 0;
                }
            }, 1000);
            
            // Handle video errors
            videoPlayer.addEventListener('error', function() {
                console.error('Video error:', videoPlayer.error);
            });
            
            // Handle video loading
            videoPlayer.addEventListener('loadstart', function() {
                console.log('Video loading started');
            });
            
            videoPlayer.addEventListener('canplay', function() {
                console.log('Video can start playing');
            });
        });
    </script>
</body>
</html>

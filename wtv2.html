<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shaka Player</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.3/shaka-player.ui.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.3/controls.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #video-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>

<div id="video-container">
  <video id="video" class="shaka-video" playsinline></video>
  <div class="shaka-controls-container" shaka-controls></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  shaka.polyfill.installAll();

  // ==========================================
  // YOUR STREAM DATA
  // ==========================================

  const manifestUri =
    "https://a96aivottlinear-a.akamaihd.net/OTTB/pdx-nitro/live/clients/dash/enc/kvdztx0wyt/out/v1/35c85c1cc5264ddaa6d601acb893c9bf/cenc.mpd";

  const keyId =
    "7b535c85849cc63ff2db626085eca0b1";

  const key =
    "40e3f86321b88e87faba0e03fad20bae";


  // ==========================================
  // VIDEO
  // ==========================================

  const video = document.getElementById("video");
  const container = document.getElementById("video-container");

  const player = new shaka.Player(video);


  // ==========================================
  // ERROR HANDLING
  // ==========================================

  player.addEventListener("error", (event) => {
    console.error("Shaka Player Error:", event.detail);
  });


  // ==========================================
  // CLEARKEY DRM
  // ==========================================

  const clearKeyMap = {};

  clearKeyMap[keyId] = key;

  player.configure({
    drm: {
      clearKeys: clearKeyMap
    }
  });


  // ==========================================
  // SHAKA UI
  // ==========================================

  const ui = new shaka.ui.Overlay(
    player,
    container,
    video
  );

  ui.configure({
    controlPanelElements: [
      "play_pause",
      "time_and_duration",
      "spacer",
      "mute",
      "volume",
      "quality",
      "playback_rate",
      "picture_in_picture",
      "fullscreen"
    ],

    enableQualitySelection: true,
    addBigPlayButton: true
  });


  // ==========================================
  // LOAD MPD
  // ==========================================

  try {

    await player.load(manifestUri);

    console.log("Stream loaded successfully.");

  } catch (error) {

    console.error(
      "Failed to load stream:",
      error
    );

  }

});
</script>

</body>
</html>

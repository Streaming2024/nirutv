        <video autoplay muted data-shaka-player id="video" poster="https://dns-tv.pages.dev/logo/image.png" style="width:100%; height:100%"></video>
    </div>
    <script>
       const mpdUrl ='https://dice-live-oc.akamaized.net/hdntl=exp=1778587832~acl=%2F*~id=3e53fdab-0006-452e-a705-3d1dcaebb26c~data=hdntl,aXA9MjA4Ljg3LjI0MS4yMjEmZXhwPTE3Nzg1MDE0NjImZWlkPTkzODE1NiZvaWQ9MTU0JnR5cGU9Vk9EJnVpZD14UlJxbzl8YmNhZWE3Y2YtYzMzNy00MDM5LTgxNTgtM2MxY2U0OWU3MjkzJmNpZD1kY2UuZmlzZmVkJnB0PW51bGw~hmac=43c1664cdab9b7211beaac74e28ffa4cbae1d65ed5801db308ae944d27e7dbb9/dash/live/2093666/294921-318514/manifest-d.mpd';
    const kid = '4d346b1d1ae64d4a800409cffa14983e';
    const key = '208c972bd2da4359ac94e6944fe378b6';
    let player;
    let ui;
       
        function initApp() {
            shaka.polyfill.installAll();

            shaka.Player.probeSupport().then(function() {
                const video = document.getElementById('video');
                player = new shaka.Player(video);

                // Attach the player to the window to make it easy to access in the console
                window.player = player;

                const drmConfig = {
                    drm: {
                        clearKeys: {
                            [kid]: key // Set Clear Key
                        }
                    }
                };
                player.configure(drmConfig);

                player.load(mpdUrl).then(function() {
                    console.log('The video has now been loaded!');
                }).catch(onPlayerError);

                initializeUI(video);
            }).catch(onPlayerError);
        }

        function initializeUI(video) {
            const container = document.querySelector('[data-shaka-player-container]');

            // Create UI elements with Shaka's default configuration
            ui = new shaka.ui.Overlay(player, container, video);
            ui.getControls(); // This loads the default controls

            // Set fullscreen button visibility if needed
            ui.getControls().setEnabled(true);
        }

        function onPlayerError(event) {
            console.error('Player error', event);
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>

<style id="wp-custom-css">
#myDIV {
	background-color: #041c5b;
    padding: 8px 10px;
    font-weight: 700;
    margin: 1px;
	color: #fff;
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    text-align: center;
}

.mnajiri {
  display: block;
  position: relative;
  margin: 0.75pc auto;
  background: #f5f5f5;
  box-shadow: rgba(0, 0, 0, 0.57) 0pt 18.75pt 0.208333333in -15.75pt;
  border-radius: 3.75pt;
  transition: box-shadow 0.3s;
  width: 100%;
  max-width: 500px;
}

.mnajiri img {
  display: block!important;
  position: relative;
  width: 50px;
  height: 50px;
  margin: 3.75pt auto;
  padding: 3pt;
  background: transparent;
  background-color: #fff;
  border: 0 solid currentColor;
  border-bottom: 0.03125in solid darkred;
  border-radius: 50%!important;

  transition: box-shadow 0.3s;
}

.details_match {
    display: inline-flex;
    font-size: 0.875pc;
    background-color: darkslateblue;
    width: 100%;
    border-bottom: 2px solid darkred;
    border-radius: 0 0 10px 10px;
}

.details_match span {
  width: 100%;
  height: 2.25pc;
  line-height: 0.375in;
  text-align: center;
  color: #fff;
  border: 0 solid currentColor;
}

.fullink {
  display: block;
  position: absolute;
  width: 100%;
  height: 100%;
  right: 0;
  z-index: 5;
}

.mpart1 {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 10px;
}

.fname {
    text-align: center;

.mpart1 strong {

  height: 36px;

  position: relative;
  color: #fff;
  text-align: center;
  border-bottom: 2px solid darkred;
  border-radius: 0 10px 0 10px;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  order: 2;
  margin: 0 10px;
}

.notetext {
  padding: 0.6pc 0.6pc 0.6pc 1pc;
  background: rgba(236, 239, 241, 0.8);
  font-size: 0.85rem;
  font-family: var(--fontB);
  line-height: 1.6em;
  border-radius: 0.05166667in;
  overflow: hidden;
}

div#match_today h2 {
  padding: 5.5pt 7.5pt;
  text-align: center;
  font-size: 1.0rem !important;
  color: #fff;
  background: darkred;
  margin-bottom: 10px;
  width: 100%;
  box-sizing: border-box;
}

.left_match {
  width: 40%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  order: 1;
}

.right_match {
  width: 40%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  order: 3;
}

.najiri1 {
  background-color: #532855;
}

.najiri2 {
  background-color: #e91e63;
}

.najiri3 {
  background-color: #4caf50;
}

.genzaitv {
  background: #fff none repeat scroll 0 0;
  border: 0.75pt solid #d0cbcb;
  border-radius: 0.25em;
  color: #086c9a;
  display: inline-block;
  font-style: normal;
  font-variant: normal;
  font-weight: bold;
  font-stretch: normal;
  font-size: 14px;
  line-height: normal;
  margin: 4px;
  min-width: 80px;
  padding: 8px 12px;
  text-align: center;
  text-decoration: none;
  transition: all 0.3s ease;
}

.genzaitv:hover {
  border-color: #fff;
  box-shadow: 0 1px 3px rgba(255, 56, 56, 0.6);
  color: darkred;
}

.activebtn {
  background-color: darkblue !important;
  color: white !important;
}

}

  padding: 0 10px;
  box-sizing: border-box;

  display: block;
  text-align: center;
  width: 100%;

#match_today {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;

<div class="entry-content" itemprop="text">
<center id="myDIV"></center>
<br>
<div class="match_today container" id="match_today">
  <h2>Today's Live Matches <span style="font-size: small;">(Your Time)</span></h2>
  <div class="livematch-content">
    <!-- Matches will be loaded here -->
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
// JavaScript code remains the same as before
var url = "https://yonotv.pages.dev/api.json";
var dateToday = new Date();
var arr = [];
var activeButton = "all";
var activeColor = "#00008b";
var otherColor = "#ffffff";

// Fetch data from the API
fetch(url)
  .then(response => {
    if (!response.ok) {
      throw new Error('Network response was not ok');
    }
    return response.json();
  })
  .then(data => {
    console.log("Data loaded successfully:", data);
    
    if (Array.isArray(data) && data.length > 0 && data[0].data) {
      var matchData = data[0].data;
      buttons(matchData);
      
      arr = matchData
        .filter(match => match.time)
        .sort(function(a, b) { 
          return new Date(a.time) - new Date(b.time); 
        });
      
      console.log("Sorted matches:", arr);
      matches(arr);
    } else {
      console.error("Invalid data structure:", data);
      $(".livematch-content").html('<div class="notetext">No match data available.</div>');
    }
  })
  .catch(error => {
    console.error('Error fetching data:', error);
    $(".livematch-content").html('<div class="notetext">Error loading matches. Please try again later.</div>');
  });

function buttons(arr) {
  $("#myDIV").empty();
  
  var btn = `<a class="genzaitv activebtn" id="all" href="#" onClick="onClick(this.id)">All</a>`;
  $("#myDIV").append(btn);
  
  var leagueList = [];
  
  for (let i = 0; i < arr.length; i++) {
    try {
      if (arr[i].title && !leagueList.includes(arr[i].title)) {
        leagueList.push(arr[i].title);
        var btnId = arr[i].title.replace(/[\s\.]/g, "");
        var btn = `<a class="genzaitv" href="#" id="${btnId}" onClick="onClick(this.id)">${arr[i].title}</a>`;
        $("#myDIV").append(btn);
      }
    } catch (error) {
      console.error("Error creating button:", error);
    }
  }
}

function matches(arr) {
  $(".livematch-content").empty();
  
  if (!arr || arr.length === 0) {
    $(".livematch-content").html('<div class="notetext">No upcoming matches found.</div>');
    return;
  }
  
  var displayedDates = new Set();
  var hasMatches = false;
  
  for (let i = 0; i < arr.length; i++) {
    try {
      var matchTime = new Date(arr[i].time);
      var now = new Date();
      
      var timeUntilMatch = matchTime - now;
      var sixHoursInMs = 6 * 60 * 60 * 1000;
      
      if (timeUntilMatch > -sixHoursInMs) {
        hasMatches = true;
        
        var dateKey = matchTime.toDateString();
        if (!displayedDates.has(dateKey)) {
          displayedDates.add(dateKey);
          
          var headerText = "";
          if (matchTime.toDateString() === new Date().toDateString()) {
            headerText = "Today's Live Matches";
          } else if (matchTime.toDateString() === new Date(Date.now() + 86400000).toDateString()) {
            headerText = "Tomorrow's Live Matches";
          } else {
            const month = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            headerText = `${matchTime.getDate()} ${month[matchTime.getMonth()]}, ${matchTime.getFullYear()} Live Matches`;
          }
          
          var site = `<h2>${headerText} <span style="font-size: small;">(Your Time)</span></h2>`;
          $(".livematch-content").append(site);
        }

        var timeDisplay = formatMatchTime(matchTime);
        var timeClass = "najiri1";
        var timeStyle = timeDisplay === "LIVE" ? 'style="background:#8b0000"' : '';
        
        var matchHtml = `
          <div class="mnajiri">
            <a class="fullink" href="${arr[i].href || '#'}"></a>
            <div class="mnajiriin">
              <div class="mpart1">
                <div class="right_match">
                  <span class="right_tech">
                    <img src="${arr[i].homeImg || ''}" alt="${arr[i].homeTeam}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTAiIGhlaWdodD0iNTAiIHZpZXdCb3g9IjAgMCA1MCA1MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjUwIiBoZWlnaHQ9IjUwIiBmaWxsPSIjRjVGNUY1Ii8+Cjx0ZXh0IHg9IjI1IiB5PSIyNSIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjEwIiBmaWxsPSIjOTk5IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSI+VGVhbTwvdGV4dD4KPC9zdmc+'"/>
                    <div class="fname">${arr[i].homeTeam || 'Home Team'}</div>
                  </span>
                </div>
                <strong class="${timeClass}" ${timeStyle}>${timeDisplay}</strong>
                <div class="left_match">
                  <span class="left_tech">
                    <img src="${arr[i].awayImg || ''}" alt="${arr[i].awayTeam}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTAiIGhlaWdodD0iNTAiIHZpZXdCb3g9IjAgMCA1MCA1MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjUwIiBoZWlnaHQ9IjUwIiBmaWxsPSIjRjVGNUY1Ii8+Cjx0ZXh0IHg9IjI1IiB5PSIyNSIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjEwIiBmaWxsPSIjOTk5IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSI+VGVhbTwvdGV4dD4KPC9zdmc+'"/>
                    <div class="fname">${arr[i].awayTeam || 'Away Team'}</div>
                  </span>
                </div>
              </div>
              <div class="details_match">
                <span class="thany"><b>${arr[i].title || 'Match'}</b></span>
              </div>
            </div>
          </div>`;
        
        $(".livematch-content").append(matchHtml);
      }
    } catch (error) {
      console.error("Error processing match:", error, arr[i]);
    }
  }
  
  if (!hasMatches) {
    $(".livematch-content").html('<div class="notetext">No upcoming matches found.</div>');
  }
}

function onClick(response) {
  $(".genzaitv").removeClass("activebtn").css({"background-color": otherColor, "color": "black"});
  $("#" + response).addClass("activebtn").css({"background-color": activeColor, "color": "white"});
  
  activeButton = response;
  
  if (arr && arr.length > 0) {
    var filteredMatches = arr.filter(match => {
      if (response === "all") return true;
      var matchId = match.title ? match.title.replace(/[\s\.]/g, "") : "";
      return matchId === response;
    });
    
    matches(filteredMatches);
  } else {
    $(".livematch-content").html('<div class="notetext">No matches found.</div>');
  }
}

function formatMatchTime(matchTime) {
  var now = new Date();
  var timeDiff = matchTime - now;
  
  if (timeDiff <= 0) {
    return "LIVE";
  } else {
    return matchTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  }
}

$(document).ready(function() {
  setTimeout(function() {
    var headeractive = document.getElementById("myDIV");
    if (headeractive) {
      var btns = headeractive.getElementsByClassName("genzaitv");
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener("click", function() {
          var current = document.getElementsByClassName("activebtn");
          if (current.length > 0) { 
            current[0].className = current[0].className.replace(" activebtn", "");
          }
          this.className += " activebtn";
        });
      }
    }
  }, 1000);
});
</script>
